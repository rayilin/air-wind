name: Deploy teaching site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "教學網頁/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  UNIT_DIR: "教學網頁"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site (exclude answer files)
        run: |
          set -e
          mkdir -p _site
          cp -r "$UNIT_DIR/." _site/
          rm -f _site/server.js _site/questions.json _site/start-battle.bat _site/package.json
          touch _site/.nojekyll
          ls -1 _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
