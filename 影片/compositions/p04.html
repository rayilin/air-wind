<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>空氣佔有空間</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
  :root{ --ground:#0f2b23; --ink:#f2fbf6; --mint:#7fe0b0; --deep:#173a2c; --paper:#eef7f0; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--ground);
    font-family:'Microsoft JhengHei',sans-serif}
  #root{width:100%;height:100%;position:relative;overflow:hidden;
    background:radial-gradient(circle at 20% 15%, #1d4a39 0%, #0f2b23 55%, #0b1f1a 100%)}
  .frame{position:absolute;inset:0;padding:80px 110px;display:flex;flex-direction:column}
  .kicker{font-size:30px;letter-spacing:.22em;color:var(--mint);font-weight:700}
  h1{font-size:92px;line-height:1.1;color:var(--ink);font-weight:900;margin-top:14px}
  .stage{position:relative;flex:1;margin-top:26px}
  .tank{position:absolute;left:300px;bottom:130px;width:900px;height:420px;
    border:10px solid rgba(242,251,246,.85);border-top:none;border-radius:0 0 28px 28px;overflow:hidden}
  .water{position:absolute;left:0;right:0;bottom:0;height:66%;
    background:linear-gradient(180deg,rgba(79,195,247,.75),rgba(47,143,104,.9))}
  .ripple{position:absolute;left:0;right:0;top:0;height:14px;background:rgba(255,255,255,.5)}
  .cup{position:absolute;left:610px;top:-120px;width:280px;height:330px;border:10px solid var(--ink);
    border-top:none;border-radius:0 0 34px 34px;background:#eef7f0}
  .cup::before{content:'';position:absolute;left:-10px;right:-10px;top:-10px;height:14px;
    background:var(--ink);border-radius:8px}
  .air{position:absolute;left:50%;top:52%;width:150px;height:150px;margin-left:-75px;
    border-radius:50%;border:4px dashed rgba(255,255,255,.55)}
  .air-text{position:absolute;left:50%;top:52%;margin-left:-46px;margin-top:-18px;
    font-size:30px;color:#fff;font-weight:700;letter-spacing:.08em}
  .bub{position:absolute;width:26px;height:26px;border-radius:50%;
    background:rgba(255,255,255,.85);opacity:0}
  .cap{position:absolute;left:110px;right:110px;bottom:24px;font-size:42px;color:var(--ink);
    font-weight:700;text-align:center;opacity:0}
  .cap b{color:var(--mint)}
</style>
</head>
<body>
<div id="root" data-composition-id="p04" data-start="0" data-duration="14" data-width="1920" data-height="1080">
  <div class="clip" data-start="0" data-duration="14" data-track-index="0">
    <div class="frame">
      <div class="kicker">空氣與風 · 概念 2</div>
      <h1>杯子裡有空氣</h1>
      <div class="stage">
        <div class="tank"><div class="water"></div><div class="ripple" id="ripple"></div></div>
        <div class="cup" id="cup">
          <div class="air"></div>
          <div class="air-text">空氣</div>
        </div>
        <div class="bub" id="b1" style="left:700px;bottom:150px"></div>
        <div class="bub" id="b2" style="left:760px;bottom:150px"></div>
        <div class="bub" id="b3" style="left:820px;bottom:150px"></div>
      </div>
      <p class="cap" id="cap1">杯子倒扣壓進水裡，<b>水卻進不去</b></p>
      <p class="cap" id="cap2">把杯子傾斜，空氣跑出來，水就進去了</p>
    </div>
  </div>
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#cup", { y: -60, rotation: 0 }, { y: 300, duration: 2.4, ease: "power2.inOut" }, 0.5)
    .fromTo("#ripple", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 2.7)
    .fromTo("#cap1", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6 }, 3.0)
    .fromTo("#cup", { rotation: 0 }, { rotation: 14, duration: 1.2, ease: "power1.inOut" }, 6.2)
    .fromTo(["#b1","#b2","#b3"], { opacity: 0, y: 0 }, { opacity: 1, y: -160, duration: 1.6, stagger: 0.18, ease: "power1.out" }, 6.6)
    .fromTo("#cap1", { opacity: 1 }, { opacity: 0, duration: 0.4 }, 8.4)
    .fromTo("#cap2", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6 }, 8.8)
    .fromTo("#ripple", { opacity: 1 }, { opacity: 0.35, duration: 1.2 }, 9.0);
  window.__timelines["p04"] = tl;
  tl.seek(0);
</script>
</body>
</html>
